<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#f5a623">
<title>家族の調子</title>
<style>
  :root{
    --bg:#f6f4ef; --card:#ffffff; --ink:#2b2b2b; --sub:#7a756c;
    --line:#e7e2d8; --accent:#f5a623; --accent-ink:#7a4d00;
    --green:#4caf72; --yellow:#e6a817; --red:#e2604a;
    --shadow:0 6px 20px rgba(0,0,0,.06);
    --radius:18px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#1a1917; --card:#26241f; --ink:#f0ece3; --sub:#a49e91;
      --line:#39352d; --accent:#f5a623; --accent-ink:#ffdca0;
      --green:#57c184; --yellow:#f0bd3e; --red:#ef7159;
      --shadow:0 6px 20px rgba(0,0,0,.3);
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
    background:var(--bg); color:var(--ink);
    min-height:100vh; line-height:1.6;
    overscroll-behavior:none;
  }
  .app{max-width:520px; margin:0 auto; padding:16px 16px 40px; min-height:100vh;}
  header.top{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
  header.top h1{font-size:20px; margin:0; letter-spacing:.02em;}
  header.top .date{font-size:13px; color:var(--sub);}
  .iconbtn{background:none; border:none; color:var(--sub); font-size:20px; cursor:pointer; padding:6px;}

  .card{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px; margin-bottom:14px; border:1px solid var(--line);}
  .btn{display:block; width:100%; border:none; border-radius:14px; padding:15px; font-size:16px; font-weight:700; cursor:pointer; background:var(--accent); color:var(--accent-ink); transition:transform .05s;}
  .btn:active{transform:scale(.98);}
  .btn.secondary{background:transparent; color:var(--sub); border:1px solid var(--line); font-weight:600;}
  .btn.ghost{background:transparent; color:var(--accent-ink); font-weight:600;}

  /* member card */
  .member{display:flex; align-items:center; gap:14px; padding:14px 16px; cursor:pointer;}
  .avatar{width:46px; height:46px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:24px; flex-shrink:0;}
  .member .info{flex:1; min-width:0;}
  .member .name{font-weight:700; font-size:16px;}
  .member .msg{font-size:13px; color:var(--sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .signal{width:16px; height:16px; border-radius:50%; flex-shrink:0;}
  .signal.g{background:var(--green);} .signal.y{background:var(--yellow);} .signal.r{background:var(--red);}
  .signal.none{background:var(--line);}
  .trend{font-size:20px; width:26px; text-align:center; flex-shrink:0;}
  .spark{width:64px; height:26px; flex-shrink:0;}

  .empty{text-align:center; color:var(--sub); padding:30px 10px;}
  .sectlabel{font-size:12px; color:var(--sub); text-transform:none; margin:18px 4px 8px; font-weight:700; letter-spacing:.04em;}

  /* last-measured chip */
  .lastchip{display:inline-block; font-size:10px; font-weight:700; padding:1px 7px; border-radius:20px; background:var(--line); color:var(--sub); white-space:nowrap; margin-right:5px;}
  .lastchip.today{background:var(--green); color:#fff;}
  .lastchip.stale{background:var(--accent); color:var(--accent-ink);}
  .lastchip.none{background:transparent; border:1px solid var(--line); color:var(--sub);}

  /* measure */
  .measure-wrap{text-align:center;}
  .step-dots{display:flex; gap:6px; justify-content:center; margin:6px 0 18px;}
  .step-dots .d{width:8px; height:8px; border-radius:50%; background:var(--line);}
  .step-dots .d.on{background:var(--accent);}
  .big-instr{font-size:17px; font-weight:700; margin:8px 0;}
  .sub-instr{font-size:14px; color:var(--sub); margin-bottom:18px;}
  .tap-area{height:300px; border-radius:22px; background:var(--accent); color:var(--accent-ink); display:flex; flex-direction:column; align-items:center; justify-content:center; user-select:none; cursor:pointer; margin-bottom:16px;}
  .tap-area.pre{background:var(--card); border:2px dashed var(--line); color:var(--sub);}
  .tap-count{font-size:64px; font-weight:800; line-height:1;}
  .tap-timer{font-size:16px; font-weight:700; margin-top:8px;}
  .tap-hint{font-size:14px; opacity:.85; margin-top:4px;}

  .rt-area{height:300px; border-radius:22px; display:flex; flex-direction:column; align-items:center; justify-content:center; user-select:none; cursor:pointer; margin-bottom:16px; font-weight:800; font-size:26px;}
  .rt-wait{background:#c7452f; color:#fff;}
  .rt-go{background:var(--green); color:#fff;}
  .rt-ready{background:var(--card); border:2px dashed var(--line); color:var(--sub); font-size:18px; font-weight:700;}
  .rt-result{background:var(--card); border:1px solid var(--line); color:var(--ink); font-size:18px;}
  .rt-trials{display:flex; gap:8px; justify-content:center; margin-bottom:14px;}
  .rt-trials .t{width:12px;height:12px;border-radius:50%;background:var(--line);}
  .rt-trials .t.done{background:var(--green);}
  .rt-trials .t.bad{background:var(--red);}

  /* result */
  .result-score{font-size:56px; font-weight:800; text-align:center;}
  .result-signal{text-align:center; font-size:18px; font-weight:700; margin-top:4px;}
  .metric-row{display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); font-size:14px;}
  .metric-row:last-child{border-bottom:none;}
  .metric-row .val{font-weight:700;}
  .bar{height:8px; border-radius:6px; background:var(--line); overflow:hidden; margin-top:4px;}
  .bar>span{display:block; height:100%; background:var(--accent);}

  /* detail */
  .linechart{width:100%; height:120px;}
  .hist-row{display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--line); font-size:14px;}
  .hist-row:last-child{border-bottom:none;}

  /* forms / modal — centered so it never hides behind the phone's URL bar / keyboard */
  .modal-bg{position:fixed; inset:0; background:rgba(0,0,0,.4); display:flex; align-items:center; justify-content:center; z-index:50; padding:16px;}
  .modal{background:var(--card); border-radius:22px; padding:20px; width:100%; max-width:520px; max-height:85vh; overflow-y:auto; -webkit-overflow-scrolling:touch;}
  input,select{width:100%; padding:12px; border-radius:12px; border:1px solid var(--line); background:var(--bg); color:var(--ink); font-size:16px; margin-bottom:12px;}
  .emoji-pick{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px;}
  .emoji-pick button{font-size:24px; width:44px; height:44px; border-radius:12px; border:1px solid var(--line); background:var(--bg); cursor:pointer;}
  .emoji-pick button.sel{border-color:var(--accent); background:var(--accent); }
  .row2{display:flex; gap:10px;}
  .note{font-size:12px; color:var(--sub); text-align:center; margin-top:10px;}
  .badge{display:inline-block; font-size:11px; padding:2px 8px; border-radius:20px; background:var(--line); color:var(--sub); margin-left:6px; vertical-align:middle;}
  a.link{color:var(--accent-ink); cursor:pointer; text-decoration:underline; font-size:13px;}

  /* sync status */
  .syncbar{display:flex; align-items:center; justify-content:center; gap:6px; font-size:11px; color:var(--sub); margin:-4px 0 10px;}
  .syncdot{width:7px; height:7px; border-radius:50%; background:var(--sub);}
  .syncdot.on{background:var(--green);} .syncdot.off{background:var(--line);} .syncdot.err{background:var(--red);}
  .code-box{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:17px; letter-spacing:.04em; text-align:center; background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px; word-break:break-all; user-select:all;}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script src="config.js"></script>
<script>
"use strict";

/* ---------- storage ---------- */
const KEY = "kazokuChoshi_v1";
const CODE_KEY = "kazokuChoshi_familyCode";
const EMOJIS = ["👨","👩","👧","👦","👴","👵","🧑","👶","🐱","🐶"];
function load(){
  try{ return JSON.parse(localStorage.getItem(KEY)) || {profiles:[], records:{}}; }
  catch(e){ return {profiles:[], records:{}}; }
}
function save(){ localStorage.setItem(KEY, JSON.stringify(db)); }
let db = load();

/* ---------- family code + sync bridge ----------
   The Firebase module (bottom of this file) registers itself as
   window.__syncImpl. Everything here degrades gracefully to
   "this device only" when that never happens. */
let familyCode = localStorage.getItem(CODE_KEY) || "";
let syncStatus = "off"; // off | connecting | on | err

const CODE_ALPHA = "abcdefghjkmnpqrstuvwxyz23456789"; // no i,l,o,0,1
function makeFamilyCode(){
  const grp = n => Array.from({length:n},()=>CODE_ALPHA[Math.floor(Math.random()*CODE_ALPHA.length)]).join("");
  return `kzk-${grp(4)}-${grp(4)}-${grp(4)}`; // 18 chars, unguessable
}
function syncConfigured(){
  const c = window.FIREBASE_CONFIG;
  return !!(c && c.databaseURL);
}
const Sync = {
  get on(){ return !!(familyCode && window.__syncImpl); },
  pushProfile(p){ if(this.on) window.__syncImpl.pushProfile(p); },
  pushRecord(pid, rec){ if(this.on) window.__syncImpl.pushRecord(pid, rec); },
  pushGroupName(name){ if(this.on) window.__syncImpl.pushGroupName(name); },
  removeProfile(id){ if(this.on) window.__syncImpl.removeProfile(id); },
  replaceAll(){ if(this.on) window.__syncImpl.replaceAll(db); },
};

// called by the Firebase module when remote data arrives
function applyRemote(remote){
  const profiles = Object.entries(remote.profiles||{})
    .map(([id,p])=>({id, ...p}))
    .sort((a,b)=>(a.order||0)-(b.order||0));
  const records = {};
  for(const [pid, byDate] of Object.entries(remote.records||{})){
    records[pid] = Object.entries(byDate)
      .map(([date,rec])=>({date, ...rec}))
      .sort((a,b)=>a.date<b.date?-1:1);
  }
  db = {profiles, records, groupName: remote.groupName||""};
  save();
  // never yank the screen out from under someone mid-measurement
  if(state.view!=="measure") render();
}
function setSyncStatus(s){ syncStatus=s; const el=document.getElementById("syncbar"); if(el) el.outerHTML=syncBarHTML(); }
function syncBarHTML(){
  let dot="off", txt;
  if(!syncConfigured()) txt="この端末のみに保存中（共有は未設定）";
  else if(!familyCode) txt="この端末のみ・家族グループ未参加";
  else if(syncStatus==="on"){ dot="on"; txt="家族グループと同期中"; }
  else if(syncStatus==="err"){ dot="err"; txt="オフライン（この端末に保存）"; }
  else txt="接続しています…";   // connecting、または接続待ち
  return `<div class="syncbar" id="syncbar"><span class="syncdot ${dot}"></span>${txt}</div>`;
}

function createFamilyGroup(){
  familyCode = makeFamilyCode();
  localStorage.setItem(CODE_KEY, familyCode);
  closeModal();
  if(window.__syncImpl){ window.__syncImpl.join(familyCode, true); } // true = seed remote from local
  render();
  setTimeout(()=>openFamilyCode(true), 300);
}
function joinFamilyGroup(){
  const v = (document.getElementById("joinCode").value||"").trim().toLowerCase();
  if(v.length<16){ alert("合言葉が短すぎるようです。kzk- から始まる全体をそのまま貼り付けてください。"); return; }
  if(!confirm("この端末の今の記録は、家族グループの内容に置きかわります。よろしいですか？")) return;
  familyCode = v;
  localStorage.setItem(CODE_KEY, familyCode);
  closeModal();
  if(window.__syncImpl){ window.__syncImpl.join(familyCode, false); }
  render();
}
function leaveFamilyGroup(){
  if(!confirm("家族グループから抜けます。（グループのデータは消えません）")) return;
  familyCode=""; localStorage.removeItem(CODE_KEY);
  if(window.__syncImpl) window.__syncImpl.leave();
  syncStatus="off"; closeModal(); render();
}

function todayStr(){ const d=new Date(); return d.toISOString().slice(0,10); }
function fmtDate(s){ const d=new Date(s+"T00:00"); return (d.getMonth()+1)+"/"+d.getDate(); }
function uid(){ return Math.random().toString(36).slice(2,9); }

/* ---------- metric orientation ----------
   Each raw metric normalized to the person's own baseline.
   z>0 means "better than usual". */
const METRICS = [
  {k:"tapCount", label:"タップ数",   dir:+1, dim:"body"},
  {k:"tapCV",    label:"リズムの安定",dir:-1, dim:"mind"}, // lower CV = steadier
  // rtInv = 1000/RT の平均。PVT で睡眠不足・疲労にもっとも敏感とされる指標。
  // rtMedian も記録するが採点には使わない（同じものを二重に数えないため）
  {k:"rtInv",    label:"処理の速さ", dir:+1, dim:"body"},
  {k:"rtSD",     label:"反応の安定", dir:-1, dim:"mind"},
  {k:"rtLapses", label:"見落とし",   dir:-1, dim:"mind"},
];

function mean(a){ return a.reduce((x,y)=>x+y,0)/a.length; }
function std(a){ if(a.length<2) return 0; const m=mean(a); return Math.sqrt(mean(a.map(x=>(x-m)**2))); }
function median(a){
  if(!a.length) return 0;
  const s=a.slice().sort((x,y)=>x-y), h=Math.floor(s.length/2);
  return s.length%2 ? s[h] : (s[h-1]+s[h])/2;
}
// median absolute deviation → 標準偏差に換算（1日だけの大きな外れ値に引きずられない）
function mad(a){
  if(a.length<2) return 0;
  const m=median(a);
  return median(a.map(x=>Math.abs(x-m))) * 1.4826;
}

const BASE_MIN_DAYS = 4;    // 平常値に必要な最低日数
const BASE_WINDOW   = 21;   // 参照する直近日数
// 反応テストの試行数。5回では「ばらつき」の推定が不安定で精度の足かせになるため
// 10回に増やし、そのぶん待ち時間を短くして所要時間を抑えている
const RT_TRIALS     = 10;

// baseline from prior records (exclude the record itself)
function baselineFor(recs, metricKey, excludeDate){
  const vals = recs.filter(r=>r.date!==excludeDate && r[metricKey]!=null)
                   .map(r=>r[metricKey]).slice(-BASE_WINDOW);
  if(vals.length<BASE_MIN_DAYS) return null;
  const m = median(vals);
  // ばらつきの下限を設ける。履歴が数日しかないと MAD が偶然ゼロ近くになり、
  // わずかな差が z=±3 に跳ねてしまうため。
  const floor = Math.abs(m)*0.06;
  const s = Math.max(mad(vals), floor, 1e-6);
  return {m, s, n:vals.length};
}

// composite z of a record given the person's history
function scoreRecord(recs, rec){
  let zs=[], dims={body:[], mind:[]}, nDays=0;
  for(const met of METRICS){
    if(rec[met.k]==null) continue;
    const b = baselineFor(recs, met.k, rec.date);
    if(!b) continue;
    nDays = Math.max(nDays, b.n);
    let z = (rec[met.k]-b.m)/b.s;
    z = z*met.dir; // orient so + = better
    z = Math.max(-3, Math.min(3, z));
    zs.push(z); dims[met.dim].push(z);
  }
  if(zs.length===0) return {ready:false};
  // 普段と3時間以上ずれた時刻の測定は、時間帯の影響が混ざるため参考値として扱う
  const hrs = recs.filter(r=>r.date!==rec.date && r.hour!=null).map(r=>r.hour);
  const offHour = (rec.hour!=null && hrs.length>=BASE_MIN_DAYS)
    ? Math.abs(rec.hour-median(hrs))>=3 : false;
  const body = dims.body.length? mean(dims.body):null;
  const mind = dims.mind.length? mean(dims.mind):null;
  // 体2指標・心3指標なので単純平均だと心に偏る。次元ごとに均して合成する
  const parts = [body, mind].filter(v=>v!=null);
  const comp = mean(parts);
  return {
    ready:true,
    z: comp,
    display: zToScore(comp),
    body, mind,
    nDays, offHour,
    conf: nDays>=10 ? "high" : nDays>=7 ? "mid" : "low",
  };
}

// z を 0〜100 の表示スコアへ。両端で滑らかに飽和させ、
// 「0点」「100点」に張り付いて不安を煽ったり伸びしろが消えたりしないようにする
function zToScore(z){
  return Math.round(50 + 45*Math.tanh(z/2.2));
}
function signalFromZ(z){
  if(z>=-0.5) return "g";
  if(z>=-1.5) return "y";
  return "r";
}
function signalLabel(sig){
  return sig==="g"?"いつも通り・good": sig==="y"?"少しお疲れ気味かも": "かなり無理してるサイン";
}

// how many prior records the person has (to know if baseline ready)
function priorCount(recs, excludeDate){
  return recs.filter(r=>r.date!==excludeDate).length;
}

// trend: compare recent composite z vs earlier
function trendFor(pid){
  const recs = (db.records[pid]||[]).slice().sort((a,b)=>a.date<b.date?-1:1);
  const scored=[];
  for(let i=0;i<recs.length;i++){
    const s = scoreRecord(recs.slice(0,i+1), recs[i]);
    if(s.ready) scored.push({date:recs[i].date, z:s.z, display:s.display});
  }
  if(scored.length<2) return {arrow:"→", spark:scored};
  const last = scored.slice(-3), prev = scored.slice(-6,-3);
  const lm = mean(last.map(x=>x.z));
  const pm = prev.length? mean(prev.map(x=>x.z)) : scored[scored.length-2].z;
  const diff = lm-pm;
  const arrow = diff>0.3?"↗": diff<-0.3?"↘":"→";
  return {arrow, spark:scored, diff};
}

// current status for a member (latest record)
function statusFor(pid){
  const recs = (db.records[pid]||[]).slice().sort((a,b)=>a.date<b.date?-1:1);
  if(recs.length===0) return {state:"none", msg:"まだ測定していません"};
  const latest = recs[recs.length-1];
  const s = scoreRecord(recs, latest);
  const t = trendFor(pid);
  if(!s.ready){
    const need = BASE_MIN_DAYS - priorCount(recs, latest.date);
    return {state:"learning", msg:`平常値を学習中（あと${Math.max(1,need)}回）`, latest, spark:t.spark, arrow:t.arrow};
  }
  const sig = signalFromZ(s.z);
  let msg = signalLabel(sig);
  if(t.arrow==="↘") msg += "・下降ぎみ";
  else if(t.arrow==="↗") msg += "・回復傾向";
  return {state:"ok", sig, msg, score:s.display, z:s.z, body:s.body, mind:s.mind,
          conf:s.conf, nDays:s.nDays, offHour:s.offHour,
          latest, spark:t.spark, arrow:t.arrow};
}

/* ---------- sparkline ---------- */
function sparkSVG(points, w=64, h=26){
  if(!points || points.length<2) return `<svg class="spark" viewBox="0 0 ${w} ${h}"></svg>`;
  const vals = points.map(p=>p.display);
  const min=Math.min(...vals), max=Math.max(...vals), rng=(max-min)||1;
  const step = w/(vals.length-1);
  const pts = vals.map((v,i)=>`${(i*step).toFixed(1)},${(h-4 - (v-min)/rng*(h-8)).toFixed(1)}`).join(" ");
  const last = points[points.length-1];
  const col = last.z>=-0.5?"var(--green)":last.z>=-1.5?"var(--yellow)":"var(--red)";
  const lx=(w).toFixed(1), ly=(h-4-(vals[vals.length-1]-min)/rng*(h-8)).toFixed(1);
  return `<svg class="spark" viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${step*(vals.length-1)}" cy="${ly}" r="2.5" fill="${col}"/></svg>`;
}

/* ---------- app state ---------- */
let state = {view:"home"};
const app = document.getElementById("app");
function go(v, extra={}){ state={view:v, ...extra}; render(); window.scrollTo(0,0); }

/* ---------- render dispatch ---------- */
function render(){
  if(state.view==="home") return renderHome();
  if(state.view==="pickMeasure") return renderPickMeasure();
  if(state.view==="measure") return renderMeasure();
  if(state.view==="detail") return renderDetail(state.pid);
}

function headerBar(title, back){
  const d=new Date();
  const ds=`${d.getMonth()+1}月${d.getDate()}日`;
  return `<header class="top">
    ${back?`<button class="iconbtn" onclick="go('${back}')">‹</button>`:`<button class="iconbtn" onclick="openSettings()">⚙︎</button>`}
    <h1>${title}</h1>
    <span class="date">${back?"":ds}</span>
  </header>`;
}

/* ---------- HOME ---------- */
function renderHome(){
  let cards="";
  if(db.profiles.length===0){
    cards = `<div class="card empty">家族を登録して始めましょう。<br>下のボタンから追加できます。</div>`;
  }else{
    cards = db.profiles.map(p=>{
      const st = statusFor(p.id);
      const last = lastDoneLabel(p.id);
      let sigDot = st.state==="ok" ? `<div class="signal ${st.sig}"></div>` : `<div class="signal none"></div>`;
      let trend = st.state==="none" ? "" : `<div class="trend">${st.arrow||"→"}</div>`;
      let spark = st.spark && st.spark.length>1 ? sparkSVG(st.spark) : `<div style="width:64px"></div>`;
      let chip = `<span class="lastchip ${last.cls}">${last.text}</span>`;
      return `<div class="card member" onclick="go('detail',{pid:'${p.id}'})">
        <div class="avatar" style="background:${p.color}22">${p.emoji}</div>
        <div class="info">
          <div class="name">${escapeHtml(p.name)}</div>
          <div class="msg">${chip}${st.msg}</div>
        </div>
        ${spark}
        ${trend}
        ${sigDot}
      </div>`;
    }).join("");
  }
  document.title = groupTitle();
  app.innerHTML = headerBar(groupTitle()) + syncBarHTML() + `

// 最後に測定した日を「今日 / 昨日 / N日前 / 日付」で返す
function lastDoneLabel(pid){
  const recs = db.records[pid]||[];
  if(recs.length===0) return {text:"未測定", cls:"none"};
  const lastDate = recs.map(r=>r.date).sort().pop();
  const days = daysAgo(lastDate);
  if(days<=0) return {text:"今日", cls:"today"};
  if(days===1) return {text:"昨日", cls:""};
  if(days<7)   return {text:days+"日前", cls:""};
  return {text:fmtDate(lastDate), cls:"stale"};   // 1週間以上は日付＋強調
}
function daysAgo(dateStr){
  const a=new Date(dateStr+"T00:00"), b=new Date(todayStr()+"T00:00");
  return Math.round((b-a)/86400000);
}

/* ---------- MEASURE flow ---------- */
let M = null;
function startMeasure(pid){
  M = {pid, step:0, tap:null, rt:null};
  go('measure');
}
function renderMeasure(){
  if(!M){ go('home'); return; }
  const p = db.profiles.find(x=>x.id===M.pid);
  const dots = `<div class="step-dots">${[0,1,2].map(i=>`<div class="d ${i<=M.step?'on':''}"></div>`).join("")}</div>`;
  const head = `<header class="top"><button class="iconbtn" onclick="cancelMeasure()">✕</button><h1>${escapeHtml(p.name)}の測定</h1><span class="date"></span></header>`;
  if(M.step===0){ app.innerHTML = head+dots+tapStepHTML(); initTapStep(); }
  else if(M.step===1){ app.innerHTML = head+dots+rtStepHTML(); initRtStep(); }
  else { app.innerHTML = head+dots+resultHTML(); }
}
function cancelMeasure(){ M=null; go('home'); }
function goToRtStep(){ if(M){ M.step=1; renderMeasure(); } }

/* --- Step 1: tap rhythm --- */
function tapStepHTML(){
  return `<div class="measure-wrap">
    <div class="big-instr">① いつもと同じリズムで10秒間タップ</div>
    <div class="sub-instr">速すぎず、無理せず。“いつもの自分”の感覚で。</div>
    <div class="tap-area pre" id="tapArea">
      <div class="tap-count" id="tapCount">タップして<br>スタート</div>
      <div class="tap-timer" id="tapTimer"></div>
    </div>
    <div id="tapNext"></div>
  </div>`;
}
function initTapStep(){
  const area=document.getElementById("tapArea");
  const countEl=document.getElementById("tapCount");
  const timerEl=document.getElementById("tapTimer");
  let started=false, taps=[], startT=0, endT=0, lastEvt=0, done=false;
  let displayTimer=null, finishTimer=null;
  const DUR=10000;
  function onTap(e){
    e.preventDefault();
    const now=performance.now();
    if(now-lastEvt<30) return; // dedupe touch+click
    lastEvt=now;
    if(!started){
      started=true; startT=now; endT=startT+DUR;
      area.classList.remove("pre"); countEl.innerHTML="0";
      taps.push(now);
      // setTimeout/setInterval keep running when the page is backgrounded.
      // requestAnimationFrame does NOT — it would strand the user mid-measure
      // if the screen dimmed or a notification pulled them away.
      displayTimer = setInterval(tick, 100);
      finishTimer  = setTimeout(finish, DUR);
      return;
    }
    if(now<=endT){ taps.push(now); countEl.innerHTML=taps.length; }
  }
  function tick(){
    const left=Math.max(0,(endT-performance.now())/1000);
    timerEl.textContent="残り "+left.toFixed(1)+"秒";
  }
  function finish(){
    if(done) return; done=true;
    clearInterval(displayTimer); clearTimeout(finishTimer);
    area.style.pointerEvents="none";
    const intervals=[]; for(let i=1;i<taps.length;i++) intervals.push(taps[i]-taps[i-1]);
    const count=taps.length;
    const meanInt = intervals.length? mean(intervals):0;
    const cv = intervals.length>1 ? std(intervals)/meanInt : 0;
    M.tap={ tapCount:count, tapCV:+(cv).toFixed(4), tapMeanInterval:Math.round(meanInt) };
    timerEl.textContent = "計測できました";
    countEl.innerHTML = count+"<div style='font-size:16px;font-weight:600'>タップ</div>";
    // the button must live OUTSIDE #tapArea — that element has
    // pointer-events:none once counting stops, which would swallow the click
    document.getElementById("tapNext").innerHTML =
      `<button class="btn" onclick="goToRtStep()">次へ（反応テスト）→</button>`;
  }
  area.addEventListener("pointerdown", onTap);
}

/* --- Step 2: reaction time (PVT) --- */
function rtStepHTML(){
  return `<div class="measure-wrap">
    <div class="big-instr">② 緑になったら すぐタップ</div>
    <div class="sub-instr">赤の間は待つ。フライングはやり直しです。全${RT_TRIALS}回。</div>
    <div class="rt-trials" id="rtTrials">${Array.from({length:RT_TRIALS},()=>'<div class="t"></div>').join("")}</div>
    <div class="rt-area rt-ready" id="rtArea">タップして スタート</div>
    <div id="rtNext"></div>
  </div>`;
}
function initRtStep(){
  const area=document.getElementById("rtArea");
  const trialsEl=document.getElementById("rtTrials");
  const N=RT_TRIALS; let results=[]; let phase="ready"; let goT=0; let timer=null; let lastEvt=0;
  function setTrials(){
    [...trialsEl.children].forEach((el,i)=>{
      el.className="t"+(results[i]!=null?(results[i].bad?" bad":" done"):"");
    });
  }
  function nextTrial(){
    if(results.length>=N){ finish(); return; }
    phase="wait"; area.className="rt-area rt-wait"; area.textContent="待って…";
    const delay=1000+Math.random()*2000;
    timer=setTimeout(()=>{ phase="go"; goT=performance.now(); area.className="rt-area rt-go"; area.textContent="今！タップ"; }, delay);
  }
  function onTap(e){
    e.preventDefault();
    const now=performance.now();
    if(now-lastEvt<50) return; lastEvt=now;
    if(phase==="ready"){ nextTrial(); return; }
    if(phase==="wait"){
      clearTimeout(timer);
      results.push({rt:null, bad:true}); setTrials();
      area.className="rt-area rt-wait"; area.textContent="フライング！やり直し";
      phase="between"; setTimeout(nextTrial, 900); return;
    }
    if(phase==="go"){
      const rt=now-goT;
      results.push({rt:Math.round(rt), bad:false}); setTrials();
      area.className="rt-area rt-result"; area.textContent=Math.round(rt)+" ms";
      phase="between"; setTimeout(nextTrial, 700); return;
    }
  }
  function finish(){
    phase="done"; area.style.pointerEvents="none";
    const responded=results.filter(r=>!r.bad).map(r=>r.rt);
    // 100ms未満は人間の反応として速すぎる（当て推量）。標準的なPVTと同様に
    // 有効試行から外し、見落としと同じ扱いにする。0除算の防止にもなる
    const valid=responded.filter(r=>r>=100);
    const antic=responded.length-valid.length;
    const med = valid.length? Math.round(median(valid)) : 600;
    const sd = valid.length>1? Math.round(std(valid)) : 0;
    const lapses = valid.filter(r=>r>500).length + results.filter(r=>r.bad).length + antic;
    // 逆数RT（1000/RT の平均）。極端に遅い1回に振り回されにくく、
    // 疲労・睡眠不足の検出感度が中央値より高いとされる
    const inv = valid.length? +mean(valid.map(r=>1000/r)).toFixed(3) : 0;
    M.rt={ rtMedian:med, rtSD:sd, rtLapses:lapses, rtInv:inv };
    area.className="rt-area rt-result";
    area.innerHTML=`中央値 ${med}ms`;
    // same reason as the tap step: keep the button out of the tap target
    document.getElementById("rtNext").innerHTML =
      `<button class="btn" onclick="finishMeasure()">結果を見る →</button>`;
  }
  area.addEventListener("pointerdown", onTap);
}

function finishMeasure(){
  // save record（hour は「普段と違う時刻の測定」を見分けるために残す。
  // 反応速度は時間帯で大きく動くので、体調の変化と混ざらないようにする）
  const now = new Date();
  const rec = { date:todayStr(), ts:Date.now(),
                hour:+(now.getHours()+now.getMinutes()/60).toFixed(2),
                ...M.tap, ...M.rt };
  if(!db.records[M.pid]) db.records[M.pid]=[];
  // replace same-day record if exists
  db.records[M.pid] = db.records[M.pid].filter(r=>r.date!==rec.date);
  db.records[M.pid].push(rec);
  db.records[M.pid].sort((a,b)=>a.date<b.date?-1:1);
  save(); Sync.pushRecord(M.pid, rec);
  M.step=2; renderMeasure();
}

/* --- result --- */
function resultHTML(){

  const s = scoreRecord(recs, rec);

    </div>`;
  }else{
    const sig=signalFromZ(s.z);
    const col = sig==="g"?"var(--green)":sig==="y"?"var(--yellow)":"var(--red)";
    top = `<div class="card" style="text-align:center">
      <div class="signal ${sig}" style="width:28px;height:28px;margin:0 auto 8px"></div>
      <div class="result-score" style="color:${col}">${s.display}</div>
      <div class="result-signal">${signalLabel(sig)}</div>
      <div style="display:flex;gap:14px;margin-top:16px">
        <div style="flex:1"><div style="font-size:12px;color:var(--sub)">体のキレ</div>${dimBar(s.body)}</div>
        <div style="flex:1"><div style="font-size:12px;color:var(--sub)">心の余裕</div>${dimBar(s.mind)}</div>
      </div>
      ${confNoteHTML(s)}
    </div>`;
  }
  const raw = `<div class="card">
    <div class="sectlabel" style="margin-top:0">今日の記録</div>
    <div class="metric-row"><span>タップ数（10秒）</span><span class="val">${rec.tapCount} 回</span></div>
    <div class="metric-row"><span>リズムのばらつき</span><span class="val">${(rec.tapCV*100).toFixed(1)} %</span></div>
    <div class="metric-row"><span>反応の速さ（中央値）</span><span class="val">${rec.rtMedian} ms</span></div>
    <div class="metric-row"><span>反応のばらつき</span><span class="val">${rec.rtSD} ms</span></div>
    <div class="metric-row"><span>見落とし</span><span class="val">${rec.rtLapses} 回</span></div>
    ${rec.hour!=null?`<div class="metric-row"><span>測定時刻</span><span class="val">${fmtHour(rec.hour)}</span></div>`:""}
  </div>`;
  return top+raw+`<button class="btn" onclick="M=null;go('home')">ホームに戻る</button>
    <button class="btn secondary" style="margin-top:10px" onclick="go('detail',{pid:'${M.pid}'})">${escapeHtml(p.name)}の推移を見る</button>`;
}
function fmtHour(h){
  const hh=Math.floor(h), mm=Math.round((h-hh)*60);
  return `${hh}:${String(mm).padStart(2,"0")}`;
}
// 判定の確かさ（学習日数）と、時間帯ズレの注意書き
function confNoteHTML(s){
  const notes=[];
  if(s.offHour) notes.push("⏰ 普段と違う時刻の測定なので参考値です");
  if(s.conf==="low")      notes.push(`学習${s.nDays}日ぶん・精度はまだ粗めです`);
  else if(s.conf==="mid") notes.push(`学習${s.nDays}日ぶん・精度は中くらいです`);
  if(!notes.length) return "";
  return `<div style="font-size:11px;color:var(--sub);margin-top:12px;line-height:1.5">${notes.join("<br>")}</div>`;
}
function dimBar(z){
  if(z==null) return `<div class="bar"><span style="width:0"></span></div><div style="font-size:11px;color:var(--sub)">学習中</div>`;
  const pct=Math.max(4, zToScore(z));
  const col = z>=-0.5?"var(--green)":z>=-1.5?"var(--yellow)":"var(--red)";
  return `<div class="bar"><span style="width:${pct}%;background:${col}"></span></div>`;
}

/* ---------- DETAIL ---------- */
function renderDetail(pid){
  const p = db.profiles.find(x=>x.id===pid);
  if(!p){ go('home'); return; }
  const recs = (db.records[pid]||[]).slice().sort((a,b)=>a.date<b.date?-1:1);
  const st = statusFor(pid);
  const scored=[];
  for(let i=0;i<recs.length;i++){ const s=scoreRecord(recs.slice(0,i+1),recs[i]); scored.push({date:recs[i].date, rec:recs[i], s}); }

  let statusCard;
  if(st.state==="none"){
    statusCard=`<div class="card empty">まだ測定がありません。</div>`;
  }else if(st.state==="learning"){
    statusCard=`<div class="card" style="text-align:center"><div class="big-instr">${st.msg}</div>
      <div class="sub-instr">数回つづけると、あなた専用の“平常値”ができます。</div></div>`;
  }else{
    const col = st.sig==="g"?"var(--green)":st.sig==="y"?"var(--yellow)":"var(--red)";
    statusCard=`<div class="card" style="text-align:center">
      <div class="signal ${st.sig}" style="width:26px;height:26px;margin:0 auto 6px"></div>
      <div class="result-score" style="color:${col};font-size:44px">${st.score} <span style="font-size:22px">${st.arrow}</span></div>
      <div class="result-signal">${signalLabel(st.sig)}</div>
      <div style="display:flex;gap:14px;margin-top:14px">
        <div style="flex:1"><div style="font-size:12px;color:var(--sub)">体のキレ</div>${dimBar(st.body)}</div>
        <div style="flex:1"><div style="font-size:12px;color:var(--sub)">心の余裕</div>${dimBar(st.mind)}</div>
      </div>
      ${confNoteHTML(st)}</div>`;
  }

  // line chart of display scores
  const chartPts = scored.filter(x=>x.s.ready).map(x=>({date:x.date, display:x.s.display, z:x.s.z}));
  const chart = chartPts.length>=2 ? `<div class="card"><div class="sectlabel" style="margin-top:0">調子の推移</div>${lineChartSVG(chartPts)}</div>` : "";

  const hist = recs.slice().reverse().slice(0,14).map(r=>{
    const s=scoreRecord(recs, r);
    const dot = s.ready?`<span class="signal ${signalFromZ(s.z)}" style="display:inline-block;width:12px;height:12px;vertical-align:middle"></span>`:`<span class="badge">学習中</span>`;
    return `<div class="hist-row"><span>${fmtDate(r.date)} ${dot} ${s.ready?s.display:""}</span>
      <span style="color:var(--sub);font-size:13px">${r.tapCount}回 / ${r.rtMedian}ms</span></div>`;
  }).join("");

  app.innerHTML = `<header class="top"><button class="iconbtn" onclick="go('home')">‹</button>
    <h1>${p.emoji} ${escapeHtml(p.name)}</h1>
    <button class="iconbtn" onclick="editProfile('${pid}')">✎</button></header>
    ${statusCard}
    ${chart}
    <div class="card"><div class="sectlabel" style="margin-top:0">これまでの記録</div>${hist||'<div class="empty">なし</div>'}</div>
    <button class="btn" onclick="startMeasure('${pid}')">この人を今すぐ測定</button>`;
}

function lineChartSVG(pts){
  const w=480,h=120,pad=18;
  const vals=pts.map(p=>p.display);
  const min=Math.max(0,Math.min(...vals)-6), max=Math.min(100,Math.max(...vals)+6), rng=(max-min)||1;
  const step=(w-pad*2)/(pts.length-1);
  const xy=(i,v)=>[pad+i*step, h-pad-(v-min)/rng*(h-pad*2)];
  let path=pts.map((p,i)=>{const [x,y]=xy(i,p.display); return (i?"L":"M")+x.toFixed(1)+" "+y.toFixed(1);}).join(" ");
  let dots=pts.map((p,i)=>{const [x,y]=xy(i,p.display); const c=p.z>=-0.5?"var(--green)":p.z>=-1.5?"var(--yellow)":"var(--red)"; return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="${c}"/>`;}).join("");
  // 50 line (personal average)
  const [,y50]=xy(0,50);
  return `<svg class="linechart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <line x1="${pad}" y1="${y50}" x2="${w-pad}" y2="${y50}" stroke="var(--line)" stroke-dasharray="4 4"/>
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
    ${dots}</svg>
    <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--sub);margin-top:2px"><span>${fmtDate(pts[0].date)}</span><span>平常＝中央の点線</span><span>${fmtDate(pts[pts.length-1].date)}</span></div>`;
}

let pickState={emoji:EMOJIS[0]};
function emojiPickerHTML(sel){
  return `<div class="emoji-pick">${EMOJIS.map(e=>`<button class="${e===sel?'sel':''}" onclick="pickEmoji('${e}')">${e}</button>`).join("")}</div>`;
}
function pickEmoji(e){ pickState.emoji=e; const inp=document.getElementById("pfName")?.value; openAddProfile(pickState._editId, inp); }

function openAddProfile(editId, keepName){
  const editing = editId ? db.profiles.find(p=>p.id===editId) : null;
  pickState._editId=editId||null;
  if(editing && pickState.emoji===undefined) pickState.emoji=editing.emoji;
  if(!pickState.emoji) pickState.emoji = editing?editing.emoji:EMOJIS[0];
  const nameVal = keepName!==undefined? keepName : (editing?editing.name:"");
  openModal(`
    <div class="big-instr" style="text-align:center">${editing?"家族を編集":"家族を追加"}</div>
    <label style="font-size:13px;color:var(--sub)">なまえ</label>
    <input id="pfName" placeholder="例：お父さん" value="${escapeHtml(nameVal||"")}">
    <label style="font-size:13px;color:var(--sub)">アイコン</label>
    ${emojiPickerHTML(pickState.emoji)}
    <button class="btn" onclick="saveProfile()">${editing?"保存":"追加する"}</button>
    ${editing?`<button class="btn secondary" style="margin-top:8px" onclick="deleteProfile('${editId}')">この家族を削除</button>`:""}
    <button class="btn ghost" style="margin-top:8px" onclick="closeModal()">キャンセル</button>
  `);
  setTimeout(()=>document.getElementById("pfName")?.focus(),50);
}
function editProfile(id){ pickState.emoji=undefined; openAddProfile(id); }
function saveProfile(){
  const name=(document.getElementById("pfName").value||"").trim();
  if(!name){ document.getElementById("pfName").focus(); return; }
  const colors=["#f5a623","#4caf72","#e2604a","#5b8def","#a06cd5","#e6a817"];
  let target;
  if(pickState._editId){
    target=db.profiles.find(x=>x.id===pickState._editId);
    target.name=name; target.emoji=pickState.emoji;
  }else{
    target={id:uid(), name, emoji:pickState.emoji, color:colors[db.profiles.length%colors.length], order:Date.now()};
    db.profiles.push(target);
  }
  save(); Sync.pushProfile(target);
  pickState={emoji:EMOJIS[0]}; closeModal(); render();
}
function deleteProfile(id){
  if(!confirm("この家族の記録もすべて削除します。よろしいですか？")) return;
  db.profiles=db.profiles.filter(p=>p.id!==id);
  delete db.records[id];
  save(); Sync.removeProfile(id);
  pickState={emoji:EMOJIS[0]}; closeModal(); go('home');
}

  openModal(`
    <div class="big-instr" style="text-align:center">設定</div>
    <div class="sectlabel" style="margin-top:4px">グループ名</div>
    <input id="groupName" placeholder="家族" value="${escapeHtml(db.groupName||"")}" maxlength="20">
    <p class="note" style="margin:-4px 0 4px">「<b>${escapeHtml(db.groupName||"家族")}</b>の調子」と表示されます（例：田中家、営業3課）</p>
    <button class="btn secondary" onclick="saveGroupName()">名前を保存</button>
    <div class="sectlabel">家族での共有</div>
    ${familySection}
    <div class="sectlabel">データ</div>
    <button class="btn secondary" onclick="seedDemo()">デモデータを入れて動きを見る</button>
    <button class="btn secondary" style="margin-top:8px" onclick="exportData()">データを書き出す(バックアップ)</button>
    <button class="btn secondary" style="margin-top:8px;color:var(--red)" onclick="resetAll()">すべて消去</button>
    <button class="btn ghost" style="margin-top:8px" onclick="closeModal()">閉じる</button>
  `);
}
function saveGroupName(){
  const v=(document.getElementById("groupName").value||"").trim();
  db.groupName=v; save(); Sync.pushGroupName(v);
  closeModal(); render();
}
function openJoinGroup(){
  openModal(`
    <div class="big-instr" style="text-align:center">合言葉で参加する</div>
    <p class="note" style="margin:0 0 12px">家族から教えてもらった合言葉を貼り付けてください。</p>
    <input id="joinCode" placeholder="kzk-xxxx-xxxx-xxxx" autocapitalize="off" autocorrect="off" spellcheck="false">
    <button class="btn" onclick="joinFamilyGroup()">参加する</button>
    <button class="btn ghost" style="margin-top:8px" onclick="openSettings()">戻る</button>
  `);
  setTimeout(()=>document.getElementById("joinCode")?.focus(),50);
}
function openFamilyCode(isNew){
  openModal(`
    <div class="big-instr" style="text-align:center">${isNew?"家族グループを作りました":"家族の合言葉"}</div>
    <p class="note" style="margin:0 0 10px">この合言葉を家族に伝えてください。<br>各自のスマホで「合言葉で参加する」に貼り付けると、みんなの調子が見られるようになります。</p>
    <div class="code-box">${escapeHtml(familyCode)}</div>
    <button class="btn" onclick="copyCode()">合言葉をコピー</button>
    <button class="btn ghost" style="margin-top:8px" onclick="closeModal()">閉じる</button>
  `);
}
function copyCode(){
  navigator.clipboard?.writeText(familyCode).then(
    ()=>alert("合言葉をコピーしました。家族に送ってください。"),
    ()=>alert("コピーできませんでした。合言葉を長押しして選択してください。")
  );
}
function resetAll(){
  if(!confirm(Sync.on
    ? "家族グループ全員の記録を消します。よろしいですか？"
    : "すべての家族と記録を消します。よろしいですか？")) return;
  db={profiles:[],records:{}}; save(); Sync.replaceAll(); closeModal(); go('home');
}
function exportData(){
  const blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="kazoku-choshi-backup.json"; a.click();
}
function seedDemo(){
  const colors=["#f5a623","#4caf72","#e2604a"];
  const demo=[
    {name:"お父さん",emoji:"👨",trend:"down"},
    {name:"お母さん",emoji:"👩",trend:"flat"},
    {name:"むすめ",emoji:"👧",trend:"up"},
  ];
  if(Sync.on && !confirm("デモデータで家族グループの内容を置きかえます。よろしいですか？")) return;
  db={profiles:[],records:{}};
  demo.forEach((d,idx)=>{
    const id=uid();
    db.profiles.push({id, name:d.name, emoji:d.emoji, color:colors[idx], order:Date.now()+idx});
    db.records[id]=[];
    const days=12;
    for(let i=days-1;i>=0;i--){
      const dt=new Date(); dt.setDate(dt.getDate()-i);
      const date=dt.toISOString().slice(0,10);
      const prog=(days-1-i)/(days-1); // 0..1
      let health=1;
      if(d.trend==="down") health = 1 - prog*0.5 - Math.random()*0.1;
      else if(d.trend==="up") health = 0.6 + prog*0.4 + (Math.random()-0.5)*0.1;
      else health = 0.85 + (Math.random()-0.5)*0.15;
      const tapCount=Math.round(45*health + (Math.random()-0.5)*3 + 15);
      const tapCV=+(0.06 + (1-health)*0.08 + Math.random()*0.02).toFixed(4);
      const rtMedian=Math.round(240 + (1-health)*160 + (Math.random()-0.5)*20);
      const rtSD=Math.round(25 + (1-health)*60 + Math.random()*10);
      const rtLapses=Math.max(0, Math.round((1-health)*3 + (Math.random()-0.6)));
      const rtInv=+(1000/rtMedian*(1-0.05*(1-health))).toFixed(3);
      const hour=+(7.5+(Math.random()-0.5)).toFixed(2); // 毎朝7時台に測っている想定
      db.records[id].push({date,ts:dt.getTime(),hour,tapCount,tapCV,tapMeanInterval:Math.round(10000/tapCount),rtMedian,rtSD,rtLapses,rtInv});
    }
  });
  save(); Sync.replaceAll(); closeModal(); go('home');
}

/* ---------- util ---------- */
function escapeHtml(s){ return (s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ---------- boot ---------- */
render();
</script>

<!-- ============================================================
     Firebase 同期レイヤー
     config.js が未設定なら、ここは何も読み込まず
     アプリは「この端末のみ」モードで動き続けます。
     ============================================================ -->
<script type="module">
(async () => {
  const cfg = window.FIREBASE_CONFIG;
  if(!cfg || !cfg.databaseURL) return;           // 未設定 → 同期オフのまま

  // グループ未参加でも接続だけは用意しておく
  // （あとから「グループを作る」を押したとき即座に同期を始めるため）
  if(familyCode) setSyncStatus("connecting");
  let rtdb, fb;
  try{
    const appMod = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
    fb = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js");
    const app = appMod.initializeApp(cfg);
    rtdb = fb.getDatabase(app);
  }catch(e){
    console.error("Firebase の読み込みに失敗しました", e);
    setSyncStatus("err");
    return;
  }

  let unsub = null;
  const famPath = code => `families/${code}`;

  function listen(code){
    if(unsub) unsub();
    unsub = fb.onValue(fb.ref(rtdb, famPath(code)),
      snap => { const v = snap.val(); if(v) applyRemote(v); setSyncStatus("on"); },
      err  => { console.error(err); setSyncStatus("err"); }
    );
  }

  // records are written per person / per date, so two phones
  // measuring at the same time can never overwrite each other
  function stripDate(rec){ const {date, ...rest} = rec; return rest; }

  window.__syncImpl = {
    join(code, seedFromLocal){
      if(seedFromLocal) this.replaceAll(db);
      listen(code);
    },
    leave(){ if(unsub){ unsub(); unsub=null; } },
    pushProfile(p){
      const {id, ...rest} = p;
      fb.set(fb.ref(rtdb, `${famPath(familyCode)}/profiles/${id}`), rest).catch(e=>setSyncStatus("err"));
    },
    pushRecord(pid, rec){
      fb.set(fb.ref(rtdb, `${famPath(familyCode)}/records/${pid}/${rec.date}`), stripDate(rec)).catch(e=>setSyncStatus("err"));
    },
    pushGroupName(name){
      fb.set(fb.ref(rtdb, `${famPath(familyCode)}/groupName`), name||"").catch(e=>setSyncStatus("err"));
    },
    removeProfile(id){
      fb.remove(fb.ref(rtdb, `${famPath(familyCode)}/profiles/${id}`));
      fb.remove(fb.ref(rtdb, `${famPath(familyCode)}/records/${id}`));
    },
    replaceAll(local){
      const state = local || db;
      const profiles={}, records={};
      for(const p of state.profiles){ const {id,...rest}=p; profiles[id]=rest; }
      for(const [pid, list] of Object.entries(state.records||{})){
        records[pid]={}; for(const r of list) records[pid][r.date]=stripDate(r);
      }
      fb.set(fb.ref(rtdb, famPath(familyCode)), {profiles, records, groupName: state.groupName||""}).catch(e=>setSyncStatus("err"));
    },
  };

  if(familyCode) listen(familyCode);
  else setSyncStatus("off");
})();
</script>
